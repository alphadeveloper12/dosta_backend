{% extends 'kitchen/base.html' %} {% block content %}
<div class="max-w-7xl mx-auto">
 <!-- Header -->
 <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
  <div>
   <div class="flex items-center gap-3">
    <a href="{% url 'kitchen:vending_master_list' %}" class="text-gray-400 hover:text-gray-600 transition-colors">
     <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </a>
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-900 to-purple-700">
     Monthly Menu Assignment
    </h2>
   </div>
   <p class="text-gray-500 mt-1 ml-9">
    Assign active items to the Monthly menu by day.
   </p>
  </div>

  <div class="flex items-center gap-3">
   <!-- Search Form -->
   <form method="GET" class="relative group" id="searchForm">
    <input type="hidden" name="day" value="{{ selected_day }}">
    <input type="hidden" name="week" value="{{ selected_week }}">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
     <svg class="h-5 w-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
     </svg>
    </div>
    <input type="text" name="q" value="{{ request.GET.q|default:'' }}" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm shadow-sm transition-all hover:shadow-md" placeholder="Search items..." autocapitalize="off" />
   </form>
   
   <button type="submit" form="assignmentForm" class="px-5 py-2 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 transition-colors shadow-sm shadow-purple-200 flex items-center gap-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    Save Assignments
   </button>
  </div>
 </div>

 <!-- Week Tabs -->
 <div class="flex overflow-x-auto border-b border-gray-200 custom-scrollbar pb-px">
  {% for week in weeks %}
  <a href="?day={{ selected_day }}&week={{ week }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}" class="px-6 py-3 font-medium text-sm border-b-2 whitespace-nowrap transition-colors {% if week == selected_week %}border-purple-500 text-purple-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
   Week {{ week }}
  </a>
  {% endfor %}
 </div>

 <!-- Day Tabs -->
 <div class="flex overflow-x-auto border-b border-gray-200 mb-6 custom-scrollbar pb-px">
  {% for day in days %}
  <a href="?day={{ day }}&week={{ selected_week }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}" class="px-6 py-3 font-medium text-sm border-b-2 whitespace-nowrap transition-colors {% if day == selected_day %}border-purple-500 text-purple-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
   {{ day }}
  </a>
  {% endfor %}
 </div>

 <!-- Items Grid -->
 <form method="POST" action="{% url 'kitchen:save_vending_monthly_assignment' %}" id="assignmentForm">
  {% csrf_token %}
  <input type="hidden" name="day" value="{{ selected_day }}">
  <input type="hidden" name="week" value="{{ selected_week }}">
  
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
   {% for item in items %}
   <label class="bg-white rounded-xl shadow-sm border {% if item.is_assigned %}border-purple-500 ring-1 ring-purple-500{% else %}border-gray-100 hover:border-gray-300{% endif %} transition-all overflow-hidden cursor-pointer relative group flex flex-col h-full item-card">
    
    <!-- Image -->
    <div class="h-32 bg-gray-50 relative overflow-hidden flex-shrink-0">
     {% if item.image %}
     <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
     {% else %}
     <div class="w-full h-full flex items-center justify-center text-gray-300">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
     </div>
     {% endif %}
     
     <div class="absolute top-2 right-2 bg-white rounded-md p-1 shadow-sm">
      <input type="checkbox" name="item_ids" value="{{ item.id }}" class="w-5 h-5 text-purple-600 border-gray-300 rounded focus:ring-purple-500 item-checkbox" {% if item.is_assigned %}checked{% endif %}>
     </div>
    </div>

    <!-- Content -->
    <div class="p-3 flex-grow flex flex-col justify-between">
     <h3 class="font-bold text-gray-900 text-sm leading-tight mb-1" title="{{ item.name }}">
      {{ item.name }}
     </h3>
     <p class="text-xs text-gray-500 line-clamp-2">
      {{ item.description|default:"No description" }}
     </p>
    </div>
   </label>
   {% endfor %}
  </div>
 </form>
</div>

<script>
 document.addEventListener('DOMContentLoaded', function() {
   const checkboxes = document.querySelectorAll('.item-checkbox');
   checkboxes.forEach(cb => {
     cb.addEventListener('change', function() {
       const card = this.closest('.item-card');
       if(this.checked) {
         card.classList.remove('border-gray-100', 'hover:border-gray-300');
         card.classList.add('border-purple-500', 'ring-1', 'ring-purple-500');
       } else {
         card.classList.add('border-gray-100', 'hover:border-gray-300');
         card.classList.remove('border-purple-500', 'ring-1', 'ring-purple-500');
       }
     });
   });
 });
</script>
<style>
  .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
</style>
{% endblock %}
