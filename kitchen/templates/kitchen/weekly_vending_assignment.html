{% extends 'kitchen/base.html' %} {% block content %}
<div class="max-w-7xl mx-auto">
 <!-- Header -->
 <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
  <div>
   <div class="flex items-center gap-3">
    <a href="{% url 'kitchen:vending_master_list' %}" class="text-gray-400 hover:text-gray-600 transition-colors">
     <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </a>
    <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-900 to-blue-700">
     Weekly Menu Assignment
    </h2>
   </div>
   <p class="text-gray-500 mt-1 ml-9">
    Assign active items to the Weekly menu by day. Selections across tabs are preserved until you save.
   </p>
  </div>

  <div class="flex items-center gap-3">
   <!-- Search Form -->
   <form method="GET" class="relative group" id="searchForm">
    <input type="hidden" name="day" value="{{ selected_day }}">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
     <svg class="h-5 w-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
     </svg>
    </div>
    <input type="text" name="q" id="searchInput" value="{{ request.GET.q|default:'' }}" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm transition-all hover:shadow-md" placeholder="Search items..." autocapitalize="off" />
   </form>
   
   <button type="button" id="saveBtn" onclick="submitAllSelections()" disabled
    class="px-5 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-sm shadow-blue-200 flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    Save
   </button>
  </div>
 </div>

 <!-- Day Tabs -->
 <div class="flex overflow-x-auto border-b border-gray-200 mb-6 custom-scrollbar pb-px" id="dayTabs">
  {% for day in days %}
  <button type="button"
   data-day="{{ day }}"
   class="tab-btn px-6 py-3 font-medium text-sm border-b-2 whitespace-nowrap transition-colors {% if day == selected_day %}border-blue-500 text-blue-600 active-tab{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">
   {{ day }}
   <span class="tab-badge hidden ml-1.5 px-1.5 py-0.5 text-xs bg-blue-100 text-blue-700 rounded-full" data-day-badge="{{ day }}"></span>
  </button>
  {% endfor %}
 </div>

 <!-- Items Grid -->
 <form method="POST" action="{% url 'kitchen:save_vending_weekly_assignment' %}" id="assignmentForm">
  {% csrf_token %}
  <!-- Hidden fields injected by JS before submit -->
  <div id="hiddenFieldsContainer"></div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="itemGridContainer">
   {% for item in items %}
   <label class="bg-white rounded-xl shadow-sm border {% if item.is_assigned %}border-blue-500 ring-1 ring-blue-500{% else %}border-gray-100 hover:border-gray-300{% endif %} transition-all overflow-hidden cursor-pointer relative group flex flex-col h-full item-card"
    data-item-id="{{ item.id }}">
    
    <!-- Image -->
    <div class="h-32 bg-gray-50 relative overflow-hidden flex-shrink-0">
     {% if item.image %}
     <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
     {% else %}
     <div class="w-full h-full flex items-center justify-center text-gray-300">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
     </div>
     {% endif %}
     
     <div class="absolute top-2 right-2 bg-white rounded-md p-1 shadow-sm">
      <input type="checkbox" data-item="{{ item.id }}" class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500 item-checkbox" {% if item.is_assigned %}checked{% endif %}>
     </div>
    </div>

    <!-- Content -->
    <div class="p-3 flex-grow flex flex-col justify-between">
     <h3 class="font-bold text-gray-900 text-sm leading-tight mb-1" title="{{ item.name }}">
      {{ item.name }}
     </h3>
     <p class="text-xs text-gray-500 line-clamp-2">
      {{ item.description|default:"No description" }}
     </p>
    </div>
   </label>
   {% endfor %}
  </div>
 </form>
</div>

<script>
  // ── State Store ─────────────────────────────────────────────────
  // selectionStore[day] = Set of item id strings
  const selectionStore = {};
  let currentDay = '{{ selected_day }}';
  const baseUrl = window.location.pathname;

  // Initialise the current day's store from pre-rendered checkboxes
  function initCurrentDayFromDOM() {
    const checked = [...document.querySelectorAll('#itemGridContainer .item-checkbox:checked')];
    selectionStore[currentDay] = new Set(checked.map(cb => cb.dataset.item));
  }

  // ── UI helpers ──────────────────────────────────────────────────
  function updateSaveBtn() {
    const totalSelected = Object.values(selectionStore).reduce((sum, s) => sum + s.size, 0);
    document.getElementById('saveBtn').disabled = totalSelected === 0;
  }

  function updateTabBadge(day) {
    const badge = document.querySelector(`[data-day-badge="${day}"]`);
    if (!badge) return;
    const count = selectionStore[day] ? selectionStore[day].size : 0;
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.textContent = '';
      badge.classList.add('hidden');
    }
  }

  function updateAllBadges() {
    document.querySelectorAll('[data-day-badge]').forEach(b => {
      updateTabBadge(b.dataset.dayBadge);
    });
  }

  // ── Checkbox binding ────────────────────────────────────────────
  function bindCheckboxEvents() {
    const grid = document.getElementById('itemGridContainer');
    if (!grid) return;
    grid.querySelectorAll('.item-checkbox').forEach(cb => {
      cb.addEventListener('change', function () {
        const card = this.closest('.item-card');
        const itemId = this.dataset.item;
        if (!selectionStore[currentDay]) selectionStore[currentDay] = new Set();

        if (this.checked) {
          selectionStore[currentDay].add(itemId);
          card.classList.remove('border-gray-100', 'hover:border-gray-300');
          card.classList.add('border-blue-500', 'ring-1', 'ring-blue-500');
          grid.prepend(card);
        } else {
          selectionStore[currentDay].delete(itemId);
          card.classList.add('border-gray-100', 'hover:border-gray-300');
          card.classList.remove('border-blue-500', 'ring-1', 'ring-blue-500');
        }
        updateSaveBtn();
        updateTabBadge(currentDay);
      });
    });
  }

  // ── Apply stored selections to the current grid ─────────────────
  function applyStoreToGrid() {
    const grid = document.getElementById('itemGridContainer');
    const store = selectionStore[currentDay] || new Set();
    const cards = [...grid.querySelectorAll('.item-card')];

    // Sort: checked first, then alphabetically (by card order from server)
    const checkedCards = [];
    const uncheckedCards = [];

    cards.forEach(card => {
      const cb = card.querySelector('.item-checkbox');
      const itemId = cb ? cb.dataset.item : null;
      const isSelected = store.has(itemId);
      cb.checked = isSelected;
      if (isSelected) {
        card.classList.remove('border-gray-100', 'hover:border-gray-300');
        card.classList.add('border-blue-500', 'ring-1', 'ring-blue-500');
        checkedCards.push(card);
      } else {
        card.classList.add('border-gray-100', 'hover:border-gray-300');
        card.classList.remove('border-blue-500', 'ring-1', 'ring-blue-500');
        uncheckedCards.push(card);
      }
    });

    // Re-order DOM: selected first
    [...checkedCards, ...uncheckedCards].forEach(c => grid.appendChild(c));
  }

  // ── AJAX tab switching ──────────────────────────────────────────
  function switchTab(day) {
    if (day === currentDay) return;

    // Activate tab style
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const isActive = btn.dataset.day === day;
      btn.classList.toggle('border-blue-500', isActive);
      btn.classList.toggle('text-blue-600', isActive);
      btn.classList.toggle('active-tab', isActive);
      btn.classList.toggle('border-transparent', !isActive);
      btn.classList.toggle('text-gray-500', !isActive);
    });

    currentDay = day;

    const grid = document.getElementById('itemGridContainer');
    grid.style.opacity = '0.5';

    const url = new URL(window.location.href);
    url.searchParams.set('day', day);
    const q = document.getElementById('searchInput').value;
    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');

    // Update browser URL without reload
    window.history.replaceState({}, '', url);

    // Update hidden day field in the search form
    document.querySelector('#searchForm input[name="day"]').value = day;

    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(r => r.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const newGrid = doc.getElementById('itemGridContainer');
        if (newGrid) {
          grid.innerHTML = newGrid.innerHTML;

          // Merge server-side is_assigned into store if no local override yet
          if (!selectionStore[currentDay]) {
            const serverChecked = [...grid.querySelectorAll('.item-checkbox[checked]')];
            selectionStore[currentDay] = new Set(serverChecked.map(cb => cb.dataset.item));
            // Also read checked from DOM (template renders checked attr)
            const domChecked = [...grid.querySelectorAll('.item-checkbox:checked')];
            domChecked.forEach(cb => selectionStore[currentDay].add(cb.dataset.item));
          }

          applyStoreToGrid();
          bindCheckboxEvents();
          updateSaveBtn();
          updateAllBadges();
        }
        grid.style.opacity = '1';
      })
      .catch(err => {
        console.error('Tab switch error:', err);
        grid.style.opacity = '1';
      });
  }

  // ── Form submission ─────────────────────────────────────────────
  function submitAllSelections() {
    const container = document.getElementById('hiddenFieldsContainer');
    container.innerHTML = '';

    const addHidden = (name, value) => {
      const el = document.createElement('input');
      el.type = 'hidden';
      el.name = name;
      el.value = value;
      container.appendChild(el);
    };

    // active_day so the backend redirect lands on the right tab
    addHidden('active_day', currentDay);

    // Collect all days with any selection
    const daysWithData = Object.keys(selectionStore).filter(d => selectionStore[d].size > 0);

    daysWithData.forEach(day => {
      addHidden('days', day);
      selectionStore[day].forEach(id => {
        addHidden(`item_ids_${day}`, id);
      });
    });

    // Also include current tab's DOM state to catch any last-second changes
    document.querySelectorAll('#itemGridContainer .item-checkbox:checked').forEach(cb => {
      const id = cb.dataset.item;
      // Avoid duplicates (already added above)
      const alreadyAdded = [...container.querySelectorAll(`input[name="item_ids_${currentDay}"]`)]
        .some(el => el.value === id);
      if (!alreadyAdded) {
        if (!daysWithData.includes(currentDay)) addHidden('days', currentDay);
        addHidden(`item_ids_${currentDay}`, id);
      }
    });

    document.getElementById('assignmentForm').submit();
  }

  // ── AJAX Search ─────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    initCurrentDayFromDOM();
    bindCheckboxEvents();
    updateSaveBtn();
    updateAllBadges();

    // Tab click events
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.day));
    });

    // Search
    const searchInput = document.getElementById('searchInput');
    const searchForm = document.getElementById('searchForm');
    const gridContainer = document.getElementById('itemGridContainer');
    let debounceTimer;

    if (searchForm && searchInput && gridContainer) {
      searchForm.addEventListener('submit', e => e.preventDefault());
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const url = new URL(window.location.href);
          url.searchParams.set('q', searchInput.value);
          url.searchParams.set('day', currentDay);

          fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => r.text())
            .then(html => {
              const doc = new DOMParser().parseFromString(html, 'text/html');
              const newGrid = doc.getElementById('itemGridContainer');
              if (newGrid) {
                gridContainer.innerHTML = newGrid.innerHTML;
                applyStoreToGrid();
                bindCheckboxEvents();
                updateSaveBtn();
              }
            })
            .catch(err => console.error('Search fetch error:', err));
        }, 800);
      });
    }
  });
</script>

<style>
  .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
  #itemGridContainer { transition: opacity 0.15s ease; }
</style>
{% endblock %}
